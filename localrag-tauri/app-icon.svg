<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2332"/>
      <stop offset="100%" style="stop-color:#262d3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50a0ff"/>
      <stop offset="100%" style="stop-color:#3080e0"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" stroke="url(#accent)" stroke-width="8"/>

  <!-- Document icon -->
  <path d="M180 120 L280 120 L320 160 L320 360 L180 360 Z" fill="#2a3040" stroke="url(#accent)" stroke-width="4"/>
  <path d="M280 120 L280 160 L320 160" fill="none" stroke="url(#accent)" stroke-width="4"/>

  <!-- Search lines on document -->
  <line x1="200" y1="180" x2="300" y2="180" stroke="#50a0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="200" y1="220" x2="280" y2="220" stroke="#50a0ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="200" y1="260" x2="290" y2="260" stroke="#50a0ff" stroke-width="8" stroke-linecap="round"/>

  <!-- Magnifying glass -->
  <circle cx="340" cy="320" r="50" fill="none" stroke="url(#accent)" stroke-width="12"/>
  <line x1="375" y1="355" x2="410" y2="390" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>

  <!-- AI sparkle -->
  <path d="M160 80 L170 100 L190 90 L170 100 L180 120 L170 100 L150 110 L170 100 Z" fill="#50c878"/>
</svg>
